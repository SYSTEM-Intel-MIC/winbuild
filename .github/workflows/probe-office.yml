name: Probe Office ODT download

run-name: "probe: ODT /download 排查"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Run Download-Office.ps1 with diagnostics
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run office downloader + diagnostics
        shell: pwsh
        run: |
          $work = if (Test-Path 'D:\') { 'D:\output\office_dl' } else { Join-Path $env:RUNNER_TEMP 'office_dl' }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Write-Host "WORKDIR=$work"

          Write-Host '=== 跑 Download-Office.ps1（同步，完整输出）==='
          & ./scripts/Download-Office.ps1 -WorkDir $work
          Write-Host "script exit=$LASTEXITCODE"

          Write-Host "`n=== 递归列出 workdir（含目录，带体积）==="
          function Show-Tree($path, $depth) {
            if ($depth -gt 5) { return }
            Get-ChildItem -LiteralPath $path -Force -ErrorAction SilentlyContinue | ForEach-Object {
              $pad = '  ' * $depth
              if ($_.PSIsContainer) {
                $items = @(Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Force -ErrorAction SilentlyContinue)
                $size = [math]::Round(($items | Measure-Object Length -Sum).Sum / 1MB, 1)
                Write-Host ("{0}[D] {1}  files={2} size={3} MB" -f $pad, $_.FullName, $items.Count, $size)
                Show-Tree $_.FullName ($depth + 1)
              } else {
                Write-Host ("{0}    {1}  {2} bytes" -f $pad, $_.Name, $_.Length)
              }
            }
          }
          Show-Tree $work 0

          Write-Host "`n=== 全盘搜索 OfficeData / *.dat 流（C: D: 顶层+二级）==="
          foreach ($root in @('C:\', 'D:\')) {
            if (-not (Test-Path $root)) { continue }
            Get-ChildItem -Path $root -Directory -Force -ErrorAction SilentlyContinue | ForEach-Object {
              $hits = Get-ChildItem -Path $_.FullName -Recurse -Depth 3 -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like 'stream.*' -or $_.Name -eq 'OfficeData' -or $_.Name -eq 'Data' } |
                Select-Object -First 5
              foreach ($h in $hits) { Write-Host $h.FullName }
            }
          }

          Write-Host "`n=== configuration.download.xml 内容 ==="
          $cfg = Join-Path $work 'configuration.download.xml'
          if (Test-Path $cfg) { Get-Content $cfg | Write-Host } else { Write-Host '(缺失)' }

          Write-Host "`n=== ODT 自带 configuration.xml 内容 ==="
          $cfg0 = Join-Path $work 'configuration.xml'
          if (Test-Path $cfg0) { Get-Content $cfg0 | Write-Host }

          Write-Host "`n=== C2R 日志中的 SourcePath / Download 相关行 ==="
          $logs = Get-ChildItem -Path @($env:TEMP) -Recurse -Depth 2 -Filter '*.log' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-30) -and $_.Length -gt 10KB }
          foreach ($l in $logs) {
            Write-Host "--- $($l.FullName) ---"
            Select-String -LiteralPath $l.FullName -Pattern 'SourcePath|DownloadFolder|OfficeData|LocalDownload|Error|Invalid|failed' -CaseSensitive:$false |
              Select-Object -Last 25 | ForEach-Object { Write-Host $_.Line }
          }

          Write-Host "`n=== 再跑一次 setup /download 并观察新建文件（30s 后中止前）==="
          $setup = Join-Path $work 'setup.exe'
          if (Test-Path $setup) {
            $before = @(Get-ChildItem -Path $work -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object FullName)
            $p = Start-Process -FilePath $setup -ArgumentList "/download `"$cfg`"" -WorkingDirectory $work -PassThru
            $deadline = (Get-Date).AddSeconds(25)
            while (-not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
            $after = @(Get-ChildItem -Path $work -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object FullName)
            Write-Host '新增路径:'
            $after | Where-Object { $before -notcontains $_ } | Select-Object -First 30 | ForEach-Object { Write-Host "  $_" }
            if (-not $p.HasExited) { Write-Host 'setup 仍在运行，中止之'; $p.Kill() } else { Write-Host "setup exit=$($p.ExitCode)" }
          }
