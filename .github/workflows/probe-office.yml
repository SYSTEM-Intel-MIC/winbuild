name: Probe Office ODT download

run-name: "probe: ODT /download 排查"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Run Download-Office.ps1 with diagnostics
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run office downloader + diagnostics
        shell: pwsh
        run: |
          $work = if (Test-Path 'D:\') { 'D:\output\office_dl' } else { Join-Path $env:RUNNER_TEMP 'office_dl' }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Write-Host "WORKDIR=$work"
          Write-Host '=== 跑 Download-Office.ps1（同步，完整输出）==='
          & ./scripts/Download-Office.ps1 -WorkDir $work
          Write-Host "exit=$LASTEXITCODE"

          Write-Host "`n=== 目录结构（workdir，含隐藏）==="
          Get-ChildItem -Path $work -Force | Format-Table Name, Length, LastWriteTime | Out-String | Write-Host

          Write-Host "`n=== 是否存在 OfficeData（递归）==="
          $od = Get-ChildItem -Path $work -Recurse -Directory -Filter 'OfficeData' -ErrorAction SilentlyContinue
          if ($od) { $od.FullName } else { Write-Host '(无)' }

          Write-Host "`n=== configuration.download.xml 内容 ==="
          $cfg = Join-Path $work 'configuration.download.xml'
          if (Test-Path $cfg) { Get-Content $cfg | Write-Host } else { Write-Host '(缺失)' }

          Write-Host "`n=== 磁盘根目录下的 OfficeData / OfficeInstall ==="
          foreach ($root in @('C:\', 'D:\')) {
            if (Test-Path $root) {
              Get-ChildItem -Path $root -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match 'Office' } |
                ForEach-Object { Write-Host $_.FullName }
            }
          }

          Write-Host "`n=== 最近改动的 ODT/Office 相关日志（TEMP）==="
          $logs = Get-ChildItem -Path @($env:TEMP, $env:LOCALAPPDATA) -Recurse -Depth 2 -Filter '*.log' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-45) } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 8
          foreach ($l in $logs) {
            Write-Host "`n--- $($l.FullName) ($([math]::Round($l.Length/1KB,1)) KB) ---"
            Get-Content -LiteralPath $l.FullName -Tail 40 -ErrorAction SilentlyContinue | Write-Host
          }

          Write-Host "`n=== setup.exe 信息 ==="
          $setup = Join-Path $work 'setup.exe'
          if (Test-Path $setup) { (Get-Item $setup).VersionInfo | Format-List * | Out-String | Write-Host } else { Write-Host '(缺失)' }

          Write-Host "`n=== setup.exe /download 再试一次（不带引号参数、指定工作目录）==="
          if (Test-Path $setup) {
            $cfg2 = Join-Path $work 'configuration.download.xml'
            $p = Start-Process -FilePath $setup -ArgumentList "/download `"$cfg2`"" -WorkingDirectory $work -Wait -PassThru -RedirectStandardOutput (Join-Path $work 'odt.out.log') -RedirectStandardError (Join-Path $work 'odt.err.log')
            Write-Host "exit=$($p.ExitCode)"
            foreach ($f in @('odt.out.log','odt.err.log')) {
              $fp = Join-Path $work $f
              if ((Test-Path $fp) -and (Get-Item $fp).Length -gt 0) {
                Write-Host "--- $f ---"; Get-Content $fp -Tail 30 | Write-Host
              }
            }
            Get-ChildItem -Path $work -Force | Format-Table Name, Length | Out-String | Write-Host
          }
