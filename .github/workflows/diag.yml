name: Diagnostics
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: PowerShell environment probe
    runs-on: windows-2025
    steps:
      - name: "BEFORE: pwsh -> cmd -> powershell 5.1 (reproduce bug)"
        shell: pwsh
        run: |
          Write-Host "== pwsh: $($PSVersionTable.PSVersion)"
          Write-Host "== pwsh PSModulePath: $env:PSModulePath"
          $probe = @'
          Write-Host ("VER=" + $PSVersionTable.PSVersion)
          $c = Get-Command Get-FileHash -ErrorAction SilentlyContinue
          Write-Host ("GetFileHash=" + $(if ($c) { 'FOUND ' + $c.Source } else { 'MISSING' }))
          '@
          Set-Content -Path probe.ps1 -Value $probe
          Write-Host "== 不修 PSModulePath："
          cmd /c "powershell -NoProfile -ExecutionPolicy Unrestricted .\probe.ps1 < NUL"

      - name: "AFTER: same chain but with winbuild wrapper (proposed fix)"
        shell: pwsh
        run: |
          # 下面这段必须和 scripts/Get-UupIso.ps1 里的算法一字不差
          $ps7Paths = @(
              (Join-Path $PSHOME 'Modules'),
              (Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PowerShell\Modules'),
              (Join-Path $env:ProgramFiles 'PowerShell\Modules')
          )
          $childModulePath = (@(
              (Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'WindowsPowerShell\Modules'),
              (Join-Path $env:ProgramFiles 'WindowsPowerShell\Modules'),
              (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules')
          ) + @(($env:PSModulePath -split ';') | Where-Object { $_ -and ($ps7Paths -notcontains $_) })) -join ';'
          Write-Host "== 修正后的子进程 PSModulePath:"
          Write-Host "   $childModulePath"

          $wrapperPath = Join-Path (Get-Location) '_winbuild_run.cmd'
          $wrapperLines = @(
              '@echo off'
              "set `"PSModulePath=$childModulePath`""
              'powershell -NoProfile -Command "if (Get-Command Get-FileHash -ErrorAction SilentlyContinue) { exit 0 } else { exit 1 }"'
              'if errorlevel 1 ('
              '    echo [winbuild] FAIL: Windows PowerShell cannot load Microsoft.PowerShell.Utility'
              '    exit /b 9'
              ')'
              'powershell -NoProfile -ExecutionPolicy Unrestricted .\probe.ps1 < NUL'
          )
          Set-Content -LiteralPath $wrapperPath -Value $wrapperLines -Encoding Ascii
          Write-Host "== 走 wrapper："
          cmd /c "`"$wrapperPath`""
          Write-Host "== wrapper 退出码: $LASTEXITCODE"

      - name: Native Windows PowerShell 5.1 (reference)
        shell: powershell
        run: |
          Write-Host "== (shell=powershell) $($PSVersionTable.PSVersion)"
          Write-Host "== PSModulePath: $env:PSModulePath"
          $c = Get-Command Get-FileHash -ErrorAction SilentlyContinue
          Write-Host "== Get-FileHash: $(if ($c) { 'FOUND ' + $c.Source } else { 'MISSING' })"
