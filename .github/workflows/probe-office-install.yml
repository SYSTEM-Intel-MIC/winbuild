name: Probe Office install chain

run-name: "probe: Office 离线安装链路 + arm64x 能否删除"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Download, stage as C:\OfficeInstall, install offline
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Office offline package
        shell: pwsh
        run: |
          $work = 'D:\output\office_dl'
          & ./scripts/Download-Office.ps1 -WorkDir $work
          if ($LASTEXITCODE -ne 0) { throw "Download-Office.ps1 失败，退出码 $LASTEXITCODE" }
          Write-Host "DONE 标记: $((Get-Content (Join-Path $work 'OFFICE_DL_DONE') -Raw).Trim())"

      - name: Stage C:\OfficeInstall and install offline
        shell: pwsh
        run: |
          $work = 'D:\output\office_dl'
          $img  = 'C:\OfficeInstall'

          # 1:1 复刻镜像内的结构（Get-UupIso.ps1 就是这么拷的）
          Remove-Item -LiteralPath $img -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $img | Out-Null
          Copy-Item -LiteralPath (Join-Path $work 'setup.exe') -Destination $img -Force
          Copy-Item -LiteralPath (Join-Path $work 'configuration.xml') -Destination $img -Force
          Copy-Item -LiteralPath (Join-Path $work 'Office') -Destination $img -Recurse -Force

          Write-Host "`n=== 镜像内结构（将原样进 ISO）==="
          Get-ChildItem -LiteralPath $img -Recurse -Force |
            Where-Object { $_.PSIsContainer -or $_.Length -gt 1MB } |
            ForEach-Object {
              if ($_.PSIsContainer) { Write-Host "[D] $($_.FullName)" }
              else { Write-Host "     $($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }
            }

          $total = (Get-ChildItem -LiteralPath $img -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "总计 $([math]::Round($total/1MB,1)) MB"

          # --- 实验：删掉 arm64 交叉部件，看 x64 装机还成不成（能删就净省 472 MB）---
          $arm = @(Get-ChildItem -LiteralPath (Join-Path $img 'Office') -Recurse -File -Force |
                   Where-Object { $_.Name -match 'arm64' })
          $armMB = [math]::Round(($arm | Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host "`n=== 实验组：删除 arm64 部件 $($arm.Count) 个 / $armMB MB ==="
          $arm | ForEach-Object { Write-Host "  删 $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }
          $arm | Remove-Item -Force

          # --- 关键：屏蔽 Office CDN，逼 setup 只能读本地源 ---
          # 上一版用日志里的 TransferredBytes 判断联网是错的：本地拷贝也记这个字段，
          # 而且装机时网络是通的，根本分不清是读本地还是从 CDN 重下（重下的话删掉的
          # 451 MB 会在目标机上被重新拉回来，白省）。hosts 一屏蔽就只剩一条路。
          $hosts = 'C:\Windows\System32\drivers\etc\hosts'
          $block = @(
            '127.0.0.1 officecdn.microsoft.com',
            '127.0.0.1 officecdn-cn.microsoft.com',
            '127.0.0.1 f.c2r.ts.cdn.office.net',
            '127.0.0.1 office15client.microsoft.com'
          )
          Add-Content -LiteralPath $hosts -Value ("`n# WINBUILD-OFFICE-CDN-BLOCK`n" + ($block -join "`n"))
          ipconfig /flushdns | Out-Null
          Write-Host "`n=== 已屏蔽 Office CDN（hosts）==="
          foreach ($d in @('officecdn.microsoft.com','f.c2r.ts.cdn.office.net')) {
            $ok = $false
            try { $null = [System.Net.Dns]::GetHostAddresses($d); $ok = $true } catch { }
            $ip = try { (([System.Net.Dns]::GetHostAddresses($d) | Select-Object -First 1).IPAddressToString) } catch { '解析失败' }
            Write-Host "  $d -> $ip"
          }
          Write-Host "  CDN 可达性测试（curl 应该失败）:"
          & curl.exe -s -o NUL -w "    HTTP=%{http_code} connect=%{time_connect}s`n" --max-time 15 `
              "http://officecdn.microsoft.com/pr/55336b82-a18d-4dd6-b5f6-9e5095c314a6/office/data/16.0.20326.20142/v64.cab"
          if ($LASTEXITCODE -eq 0) { Write-Host "    警告：CDN 仍可达，本次离线判定不可信" } else { Write-Host "    CDN 已不可达（curl 退出码 $LASTEXITCODE）-> 离线判定可信" }

          Write-Host "`n=== 跑 setup /configure（本地源 C:\OfficeInstall，CDN 已屏蔽）==="
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath (Join-Path $img 'setup.exe') `
                   -ArgumentList "/configure `"$img\configuration.xml`"" -Wait -PassThru
          $sw.Stop()
          Write-Host "setup /configure 退出码 = $($p.ExitCode)（耗时 $([math]::Round($sw.Elapsed.TotalSeconds)) 秒）"

          Write-Host "`n=== 安装结果 ==="
          $root = 'C:\Program Files\Microsoft Office\root\Office16'
          foreach ($exe in @('WINWORD.EXE','EXCEL.EXE','POWERPNT.EXE')) {
            $hit = Get-ChildItem -Path 'C:\Program Files*' -Recurse -Filter $exe -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            if ($hit) { Write-Host "  OK  $exe -> $($hit.FullName)" } else { Write-Host "  缺失 $exe" }
          }

          Write-Host "`n=== 语言（权威判定：注册表 ClientCulture，应该 zh-CN）==="
          $cc = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Office\ClickToRun\Configuration' `
                      -Name ClientCulture -ErrorAction SilentlyContinue).ClientCulture
          Write-Host "  ClientCulture = $cc"
          $root = 'C:\Program Files\Microsoft Office\root\Office16'
          if (Test-Path $root) {
            Write-Host "  Office16 下的语言目录:"
            Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "    $($_.Name)" }
          } else {
            Write-Host "  没找到 $root"
          }

          Write-Host "`n=== 离线判定 ==="
          Write-Host "  CDN 已在安装前屏蔽，因此：退出码 0 + 三个 exe 齐全 = 纯本地源离线安装成立"
          Write-Host "  若退出码非 0 或缺 exe = 这个包不完整/必须要联网"

          Write-Host "`n=== C2R 日志里的错误 ==="
          Get-ChildItem -Path $env:TEMP -Recurse -Depth 2 -Filter '*.log' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-30) -and $_.Length -gt 10KB } |
            ForEach-Object {
              Select-String -LiteralPath $_.FullName -Pattern 'Error |Fatal|failed' -CaseSensitive:$false |
                Select-Object -Last 8 | ForEach-Object { Write-Host "  $($_.Line.Substring(0, [Math]::Min(220, $_.Line.Length)))" }
            }

          Write-Host "`nPROBE_RESULT arm64_removed=$armMB setup_exit=$($p.ExitCode)"
