name: Probe Office install chain

run-name: "probe: 断网离线安装 A/B + arm64x 能否删除"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Cut network for ODT, install A (full) then B (no arm64x)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download + cut network + A/B install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $work = 'D:\output\office_dl'
          $img  = 'C:\OfficeInstall'
          $results = @()

          Write-Host '=== 1) 下载离线包 ==='
          & ./scripts/Download-Office.ps1 -WorkDir $work
          if ($LASTEXITCODE -ne 0) { throw "Download-Office.ps1 失败 $LASTEXITCODE" }

          function Stage-Image {
            Remove-Item -LiteralPath $img -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $img | Out-Null
            Copy-Item -LiteralPath (Join-Path $work 'setup.exe') -Destination $img -Force
            Copy-Item -LiteralPath (Join-Path $work 'configuration.xml') -Destination $img -Force
            Copy-Item -LiteralPath (Join-Path $work 'Office') -Destination $img -Recurse -Force
          }

          function Test-Install([string] $Tag) {
            Write-Host ""
            Write-Host "=== setup /configure [$Tag] ==="
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath (Join-Path $img 'setup.exe') `
                     -ArgumentList "/configure `"$img\configuration.xml`"" -Wait -PassThru
            $sw.Stop()
            Write-Host ("  退出码={0}  耗时={1} 秒" -f $p.ExitCode, [math]::Round($sw.Elapsed.TotalSeconds))
            $found = 0
            foreach ($exe in @('WINWORD.EXE','EXCEL.EXE','POWERPNT.EXE')) {
              $hit = Get-ChildItem -Path 'C:\Program Files*' -Recurse -Filter $exe -ErrorAction SilentlyContinue |
                     Select-Object -First 1
              if ($hit) { $found++; Write-Host "  OK $exe" } else { Write-Host "  缺失 $exe" }
            }
            $cc = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Office\ClickToRun\Configuration' `
                        -Name ClientCulture -ErrorAction SilentlyContinue).ClientCulture
            Write-Host "  ClientCulture=$cc"
            $r = [pscustomobject]@{ tag=$Tag; exit=[int]$p.ExitCode; secs=[int]$sw.Elapsed.TotalSeconds; apps=$found; culture="$cc" }
            $script:results += $r
            return $r
          }

          function Uninstall-Office {
            Write-Host ""
            Write-Host '=== 卸载，准备下一轮 ==='
            $rm = Join-Path $img 'configuration.remove.xml'
            $xmlLines = @('<Configuration>', '  <Remove All="TRUE" />',
                          '  <Display Level="None" AcceptEULA="TRUE" />', '</Configuration>')
            Set-Content -LiteralPath $rm -Encoding utf8 -Value $xmlLines
            $p = Start-Process -FilePath (Join-Path $img 'setup.exe') `
                     -ArgumentList "/configure `"$rm`"" -Wait -PassThru
            Write-Host "  卸载退出码=$($p.ExitCode)"
            Start-Sleep -Seconds 5
          }

          function Set-OdtFirewall([bool] $Enable) {
            # 只按程序路径阻断，不影响 runner 自己的网络（日志上报、GitHub API 照常）
            $progs = @((Join-Path $img 'setup.exe'))
            foreach ($d in @('C:\Program Files\Common Files\Microsoft Shared\ClickToRun')) {
              if (Test-Path $d) {
                $progs += (Get-ChildItem -Path $d -Filter '*.exe' -File -ErrorAction SilentlyContinue).FullName
              }
            }
            foreach ($prog in ($progs | Where-Object { $_ } | Select-Object -Unique)) {
              $name = 'winbuild_odt_' + ([System.IO.Path]::GetFileNameWithoutExtension($prog))
              netsh advfirewall firewall delete rule name="$name" | Out-Null
              if ($Enable) {
                $null = netsh advfirewall firewall add rule name="$name" dir=out action=block program="$prog" enable=yes profile=any
                Write-Host "  防火墙阻断出站: $prog (代码 $LASTEXITCODE)"
              }
            }
          }

          function Test-CdnReachable([string] $Why) {
            foreach ($v in @('HTTP_PROXY','HTTPS_PROXY','http_proxy','https_proxy','ALL_PROXY','all_proxy')) {
              Remove-Item -Path "env:$v" -ErrorAction SilentlyContinue
            }
            Write-Host ""
            Write-Host "=== CDN 可达性检查（$Why）==="
            & curl.exe -s -o NUL -w "  curl HTTP=%{http_code} connect=%{time_connect}s" --max-time 15 `
                 "http://officecdn.microsoft.com/pr/55336b82-a18d-4dd6-b5f6-9e5095c314a6/office/data/16.0.20326.20142/v64.cab" |
              Out-Host
            Write-Host "  curl 退出码=$LASTEXITCODE"
            return ($LASTEXITCODE -eq 0)
          }

          Stage-Image
          $armFiles = @(Get-ChildItem -LiteralPath (Join-Path $img 'Office') -Recurse -File -ErrorAction SilentlyContinue |
                        Where-Object { $_.Name -match 'arm64' })
          $armMB = [math]::Round(($armFiles | Measure-Object Length -Sum).Sum / 1MB, 1)
          Write-Host ("arm64 部件: {0} 个 / {1} MB" -f $armFiles.Count, $armMB)

          Write-Host ''
          Write-Host '=== 2) 切断 ODT 出站网络 ==='
          Set-OdtFirewall $true
          $hosts = 'C:\Windows\System32\drivers\etc\hosts'
          $domains = @('officecdn.microsoft.com','officecdn-cn.microsoft.com',
                       'f.c2r.ts.cdn.office.net','office15client.microsoft.com',
                       'config.services.office.com','activation.sls.microsoft.com')
          Add-Content -LiteralPath $hosts -Value "`n# WINBUILD-OFFICE-CDN-BLOCK"
          foreach ($d in $domains) { Add-Content -LiteralPath $hosts -Value "127.0.0.1 $d" }
          ipconfig /flushdns | Out-Null
          $cdnUp = Test-CdnReachable '防火墙+hosts 已设置'
          if ($cdnUp) { Write-Host '  警告：CDN 仍可达，离线判定不可信' } else { Write-Host '  CDN 已不可达 -> 离线判定可信' }

          Write-Host ''
          Write-Host '=== 3) A 组：完整包（含 arm64x）+ 断网 ==='
          $a = Test-Install 'A-full'

          Uninstall-Office

          Write-Host ''
          Write-Host "=== 4) B 组：删掉 $armMB MB arm64x + 断网 ==="
          Stage-Image
          @(Get-ChildItem -LiteralPath (Join-Path $img 'Office') -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'arm64' }) | ForEach-Object {
              Write-Host "  删 $($_.Name)"; Remove-Item -LiteralPath $_.FullName -Force }
          $b = Test-Install 'B-no-arm64x'

          Set-OdtFirewall $false

          Write-Host ''
          Write-Host '=== 结论 ==='
          foreach ($r in $results) {
            Write-Host ("  {0}: exit={1} apps={2}/3 culture={3} {4}s" -f $r.tag,$r.exit,$r.apps,$r.culture,$r.secs)
          }
          Write-Host "CDN_reachable_after_setup=$cdnUp"
          $fullOk = ($a.exit -eq 0 -and $a.apps -eq 3)
          $armOk  = ($b.exit -eq 0 -and $b.apps -eq 3)
          Write-Host ("RESULT offline_full={0} arm64_removable={1}" -f $fullOk, $armOk)
          if (-not $cdnUp) {
            if ($fullOk) { Write-Host '结论1：断网下完整包能装 -> 真离线安装成立' }
            else { Write-Host '结论1：断网下装不上 -> 这个包必须要联网，离线承诺不成立' }
            if ($armOk) { Write-Host "结论2：断网 + 删 $armMB MB 也能装 -> 可以净省 $armMB MB" }
            else { Write-Host '结论2：删掉 arm64x 后断网装不上 -> 451 MB 必须保留' }
          } else {
            Write-Host 'CDN 没断干净，本次结果仅供参考'
          }
