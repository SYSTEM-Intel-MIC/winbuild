name: Build Windows 11 ISO

run-name: "Win11 ${{ inputs.build }} ${{ inputs.channel }} x64 zh-CN (${{ inputs.edition }}) via UUP dump"

on:
  workflow_dispatch:
    inputs:
      build:
        description: >-
          构建号（可手填）：填 28020 = 该版本最新修订；也可填精确版本 28020.3142。
          查最新：打开 https://uupdump.net/ 首页 Downloads 列表，看 amd64 行括号里的数字
          （如 "Windows 11 Insider Preview Feature Update (28020.3142) amd64"）；
          也可用 https://uupdump.net/known.php?q=关键词 搜索，如 category:w11-26h1。
        type: string
        default: "28020"
        required: true
      channel:
        description: "构建通道：insider=Dev/Beta/Canary 预览版（28020 属于 Beta 频道的 26H1 分支）；stable=正式版（title 含 version 26H2 之类）"
        type: choice
        options:
          - insider
          - stable
        default: insider
        required: true
      edition:
        description: "版本：pro=专业版 / enterprise=仅企业版 / enterprise_pro=专业版+企业版 / multi=家庭版+专业版"
        type: choice
        options:
          - pro
          - enterprise
          - enterprise_pro
          - multi
        default: enterprise
        required: true
      updates:
        description: "集成最新累积更新（UUP dump 下载更新包）。默认关闭：LCU/Enablement/SSU/NetFx/SetupDU/SafeOSDU 都会让镜像涨 1~2 GB，默认不装。注意：这只管「离线集成 LCU」；禁用并删除更新组件（wuauserv/UsoSvc/WaaSMedicSvc/DoSvc + AU 策略 + usoclient.exe 等）是恒定行为，与本开关无关"
        type: boolean
        default: false
      netfx3:
        description: "预装 .NET Framework 3.5"
        type: boolean
        default: true
      esd:
        description: "封盘前把 install.wim 重新打包成 install.esd（LZMS solid，约省 1.3~1.8 GB；精简/Office/MAS 集成仍在 wim 上做，之后才转）"
        type: boolean
        default: true
      reset_base:
        description: "ResetBase 组件基线重置（镜像更小，更慢）"
        type: boolean
        default: true
      skip_apps:
        description: "跳过预装 Store 应用 SkipApps（镜像更小更干净，但没有商店和内置 Appx）"
        type: boolean
        default: false
      skip_edge:
        description: "跳过 Edge 集成 SkipEdge"
        type: boolean
        default: false
      drivers:
        description: "注入仓库 Drivers/ 目录下的驱动（AddDrivers，需要仓库里放了驱动文件）"
        type: boolean
        default: false
      wim2swm:
        description: "install.wim 拆分成 install.swm（WIM 分卷；注意：产物不再是 install.wim，会连带跳过深度精简/Office/MAS 集成/OEM logo）"
        type: boolean
        default: false

      # ---- 无人值守：注入 autounattend.xml 并用 cdimage 重新封盘 ----
      unattend:
        description: "注入 autounattend.xml 到 ISO 根目录（无人值守安装；关闭则 ISO 原样出厂）"
        type: boolean
        default: true
      hw_bypass:
        description: "免硬件检测：windowsPE 阶段写 LabConfig，绕过 TPM/安全启动/内存检查（仅 unattend 开启时生效）"
        type: boolean
        default: true
      skip_oobe:
        description: "跳过 OOBE 的 EULA/联网强制/微软账户/无线设置/隐私设置页，ProtectYourPC=3；并写 BypassNRO=1 让断网也能直接建本地账户"
        type: boolean
        default: true
      oem_org:
        description: "RegisteredOrganization：winver「组织」"
        type: string
        default: "SYSTEM-Intel-MIC"
      oem_provider:
        description: "SupportProvider：「获取帮助」按钮上显示的支持提供方名称（Win11 用它覆盖 System Manufacturer）"
        type: string
        default: "SYSTEM-Intel-MIC的B站个人主页"
      oem_url:
        description: "SupportURL：「获取帮助」跳转链接；缺协议头会自动补 https://"
        type: string
        default: "https://space.bilibili.com/1978487514"
      oem_manufacturer:
        description: "Manufacturer（已弃用，写注册表 OEMInformation，Win11 设置→关于 不再显示）"
        type: string
        default: "SYSTEM-Intel-MIC"
      oem_logo:
        description: "Logo 路径；留空且仓库存在 OEM/logo.bmp 时自动用 C:\\Windows\\System32\\oemlogo.bmp 并把文件塞进 install.wim"
        type: string
        default: ""
      oem_phone:
        description: "SupportPhone（已弃用）"
        type: string
        default: ""

      # ---- 深度精简 / Office / MAS ----
      deep_debloat:
        description: "离线精简 install.wim：保留白名单式移除 Appx（含 Teams/Outlook/OneDrive/Xbox/纸牌/资讯/手机连接/获取帮助）+ 模糊匹配移除 AI/Copilot/Recall 等 Capability + 移除 IIS/MSMQ/WCF 等可选功能 + 注册表优化 + 禁用无用服务 + 删更新类计划任务 + 删更新组件本体（usoclient.exe/wuaueng.dll/wuaucpl.cpl）"
        type: boolean
        default: true
      office_offline:
        description: "离线集成 Office 365（Word/Excel/PowerPoint），ODT + 离线包在 Action 里下载，首次登录由 SYSTEM 同步安装（每次上限 20 分钟、最多 3 次，失败下次登录自动续装）"
        type: boolean
        default: true
      mas_activate:
        description: "自动激活：SYSTEM 后台等 Office 装完 + 等联网后无人值守跑 MAS /HWID /Ohook /S（离线时只跑 /Ohook）。三道兜底（autounattend specialize pass / SetupComplete → Register.cmd / Cleanup.ps1 补拉），ONLOGON 触发、最多重试 5 次、拿到授权才自删任务"
        type: boolean
        default: true
      perf_tweaks:
        description: "额外禁用更多服务/诊断/遥测（与 deep_debloat 独立，可单独开关）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-win11-x64-zh-cn
  cancel-in-progress: false

jobs:
  build:
    name: Build ISO
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check disk space
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Where-Object { $_.Free } |
            ForEach-Object { Write-Host ("{0}  空闲 {1:N1} GB" -f $_.Root, ($_.Free / 1GB)) }

          # 预装但本次构建完全用不到的大块头，能删就删，给 UUP 下载和转换留足空间
          $targets = @(
            'C:\Android',
            'C:\SeleniumWebDrivers',
            'C:\R',
            'C:\Program Files\MongoDB',
            'C:\Program Files\PostgreSQL',
            "$env:LOCALAPPDATA\pip\cache",
            "$env:LOCALAPPDATA\NuGet",
            'C:\Program Files (x86)\Microsoft SDKs\Azure'
          )
          foreach ($t in $targets) {
            if (Test-Path -LiteralPath $t) {
              Write-Host "清理 $t"
              Remove-Item -LiteralPath $t -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          # 选剩余空间最大的盘做输出目录（老镜像有 D:，Server 2025 镜像只有 C:）
          $drive = Get-PSDrive -PSProvider FileSystem |
            Where-Object { $_.Free -gt 0 } |
            Sort-Object Free -Descending |
            Select-Object -First 1
          $dest = Join-Path $drive.Root 'output'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Write-Host "输出目录: $dest（空闲 $([math]::Round($drive.Free / 1GB, 1)) GB）"
          "DEST_DIR=$dest" | Add-Content $env:GITHUB_ENV

      - name: Build ISO from UUP dump
        shell: pwsh
        env:
          # 走环境变量传参，避免输入值被拼进脚本源码
          IN_EDITION: ${{ inputs.edition }}
          IN_BUILD: ${{ inputs.build }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_OEM_ORG: ${{ inputs.oem_org }}
          IN_OEM_PROVIDER: ${{ inputs.oem_provider }}
          IN_OEM_URL: ${{ inputs.oem_url }}
          IN_OEM_MANUFACTURER: ${{ inputs.oem_manufacturer }}
          IN_OEM_LOGO: ${{ inputs.oem_logo }}
          IN_OEM_PHONE: ${{ inputs.oem_phone }}
          IN_DEEP_DEBLOAT: ${{ inputs.deep_debloat }}
          IN_OFFICE_OFFLINE: ${{ inputs.office_offline }}
          IN_MAS_ACTIVATE: ${{ inputs.mas_activate }}
          IN_PERF_TWEAKS: ${{ inputs.perf_tweaks }}
        run: |
          $dest = $env:DEST_DIR
          if (-not $dest) { $dest = Join-Path $env:RUNNER_TEMP 'output' }
          $p = @{
            Edition     = $env:IN_EDITION
            Destination = $dest
            Build       = $env:IN_BUILD
            Channel     = $env:IN_CHANNEL
          }
          if ('${{ inputs.updates }}' -eq 'false')    { $p.NoUpdates   = $true }
          if ('${{ inputs.netfx3 }}' -eq 'true')      { $p.NetFx3      = $true }
          if ('${{ inputs.esd }}' -eq 'true')         { $p.Esd         = $true }
          if ('${{ inputs.reset_base }}' -eq 'false') { $p.NoResetBase = $true }
          if ('${{ inputs.skip_apps }}' -eq 'true')   { $p.SkipApps    = $true }
          if ('${{ inputs.skip_edge }}' -eq 'true')   { $p.SkipEdge    = $true }
          if ('${{ inputs.drivers }}' -eq 'true')     { $p.Drivers     = $true }
          if ('${{ inputs.wim2swm }}' -eq 'true')     { $p.Wim2Swm     = $true }
          if ('${{ inputs.unattend }}' -eq 'true')  { $p.Unattend = $true }
          if ('${{ inputs.hw_bypass }}' -eq 'true') { $p.HwBypass = $true }
          if ('${{ inputs.skip_oobe }}' -eq 'true') { $p.SkipOobe = $true }
          if ('${{ inputs.deep_debloat }}' -eq 'true') { $p.DeepDebloat = $true }
          if ('${{ inputs.office_offline }}' -eq 'true') { $p.OfficeOffline = $true }
          if ('${{ inputs.mas_activate }}' -eq 'true') { $p.MasActivate = $true }
          if ('${{ inputs.perf_tweaks }}' -eq 'true') { $p.PerfTweaks = $true }
          $p.OemOrg          = "$env:IN_OEM_ORG"
          $p.OemProvider     = "$env:IN_OEM_PROVIDER"
          $p.OemUrl          = "$env:IN_OEM_URL"
          $p.OemManufacturer = "$env:IN_OEM_MANUFACTURER"
          $p.OemLogo         = "$env:IN_OEM_LOGO"
          $p.OemPhone        = "$env:IN_OEM_PHONE"
          foreach ($k in ($p.Keys | Sort-Object)) {
            $v = if ($k -eq 'LocalPassword') { '***' } else { $p[$k] }
            Write-Host "  参数 $k = $v"
          }
          & ./scripts/Get-UupIso.ps1 @p

      - name: Split ISO into 2GB parts
        shell: pwsh
        run: |
          if (-not $env:ISO_PATH) { throw 'ISO_PATH 未设置，构建步骤没有产出' }
          $iso = Get-Item -LiteralPath $env:ISO_PATH
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { $sevenZip = '7z.exe' }

          $free = Get-PSDrive -PSProvider FileSystem |
            Where-Object { $iso.FullName.StartsWith($_.Root) } | Select-Object -First 1
          if ($free) { Write-Host "分卷前空闲空间 $($free.Root): $([math]::Round($free.Free / 1GB, 1)) GB" }

          # 在 ISO 所在目录内执行，保证分卷包里只存文件名而不是完整路径
          $archive = Join-Path $iso.DirectoryName ($iso.BaseName + '.iso.zip')
          Write-Host "分卷: $($iso.Name) -> $($iso.BaseName).iso.zip.001 ..."
          Push-Location $iso.DirectoryName
          try {
              & $sevenZip a -v2000m -mx=0 -bso0 -bsp0 ($iso.BaseName + '.iso.zip') $iso.Name
              $code = $LASTEXITCODE
          } finally {
              Pop-Location
          }
          if ($code -ne 0) { throw "7z 分卷失败，退出码 $code" }

          $parts = @(Get-ChildItem -Path "$archive.*" -File)
          if ($parts.Count -eq 0) { throw '没有生成分卷文件' }
          $parts | ForEach-Object { Write-Host ("  {0}  {1} MB" -f $_.Name, [math]::Round($_.Length / 1MB, 1)) }

          # 分卷已校验在手，删掉原始 ISO 给发布步骤腾空间（Release 单文件上限 2GB，只能发分卷）
          Remove-Item -LiteralPath $iso.FullName -Force

          "PARTS_GLOB=$archive.*" | Add-Content $env:GITHUB_ENV
          "PARTS_DIR=$($iso.DirectoryName)" | Add-Content $env:GITHUB_ENV

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_OEM_ORG: ${{ inputs.oem_org }}
        run: |
          # 构建号是自由文本，先清洗成合法的 tag 字符（tag/branch 不允许空格等）
          $buildIn = '${{ inputs.build }}' -replace '[^A-Za-z0-9._-]', '-'
          $tag = "Win11_${buildIn}-${{ inputs.channel }}_x64_zh-CN_${{ inputs.edition }}_$($env:ISO_BUILD)_$(Get-Date -Format yyyyMMdd)"
          $title = "Windows 11 $env:ISO_BUILD (${{ inputs.channel }}) x64 zh-CN ${{ inputs.edition }}"
          $parts = @(Get-ChildItem -Path $env:PARTS_GLOB -File)
          $files = @($parts.FullName) + @("$($env:ISO_PATH).sha256.txt")

          $options = @()
          if ('${{ inputs.updates }}' -eq 'true')    { $options += '集成最新累积更新' }
          if ('${{ inputs.netfx3 }}' -eq 'true')     { $options += '.NET 3.5 预装' }
          if ('${{ inputs.esd }}' -eq 'true')        { $options += 'ESD 压缩' }
          if ('${{ inputs.reset_base }}' -eq 'true') { $options += 'ResetBase' }
          if ('${{ inputs.skip_apps }}' -eq 'true')  { $options += '跳过预装应用' }
          if ('${{ inputs.skip_edge }}' -eq 'true')  { $options += '跳过 Edge' }
          if ('${{ inputs.drivers }}' -eq 'true')    { $options += '注入 Drivers 驱动' }
          if ('${{ inputs.wim2swm }}' -eq 'true')    { $options += 'WIM 分卷' }
          if ('${{ inputs.unattend }}' -eq 'true') {
              $options += '无人值守 autounattend.xml'
              if ('${{ inputs.hw_bypass }}' -eq 'true') { $options += '免 TPM/安全启动/内存检测' }
              if ('${{ inputs.skip_oobe }}' -eq 'true') { $options += '跳过 OOBE' }
              if ($env:IN_OEM_ORG) { $options += "OEM 信息（组织=$env:IN_OEM_ORG）" }
          }
          if ('${{ inputs.deep_debloat }}' -eq 'true') { $options += '深度精简（移除 Appx/AI/服务/注册表）' }
          if ('${{ inputs.office_offline }}' -eq 'true') { $options += 'Office 365 离线集成（Word/Excel/PowerPoint）' }
          if ('${{ inputs.mas_activate }}' -eq 'true') { $options += 'MAS 首登录自动激活' }
          if ('${{ inputs.perf_tweaks }}' -eq 'true') { $options += '额外系统性能/隐私优化' }
          if (-not $options) { $options = '默认（无附加选项）' }

          $unattendNotes = ''
          if ('${{ inputs.unattend }}' -eq 'true') {
              $hwLine = if ('${{ inputs.hw_bypass }}' -eq 'true') {
                  'windowsPE 阶段写 ``HKLM\SYSTEM\Setup\LabConfig``，绕过 **TPM / 安全启动 / 内存** 检查。'
              } else {
                  '本次**没有**绕过 TPM / 安全启动 / 内存检查。'
              }
              $account = '**不预建账户**，OOBE 里会让你自己创建'
              $unattendNotes = @"
          > [!IMPORTANT]
          > 这个 ISO 根目录带 ``autounattend.xml``：$account
          > $hwLine
          > 会跳过 EULA / 微软账户 / 无线设置 / 隐私设置页并设 ``ProtectYourPC=3``；
          > 分区选择仍然由你手动操作，不会自动动磁盘。
          "@
          }

          $notes = @"
          ## $title

          | 属性 | 值 |
          | --- | --- |
          | 构建 | ``$($env:ISO_BUILD)`` |
          | 版本 | $($env:ISO_TITLE) |
          | 通道 | ``${{ inputs.channel }}``（输入构建号 ``${{ inputs.build }}``） |
          | 版本 SKU | ``${{ inputs.edition }}`` |
          | 语言 | zh-CN |
          | 架构 | x64 |
          | 镜像内版本 | $($env:ISO_IMAGES) |
          | 大小 | $([math]::Round([double]$env:ISO_SIZE / 1GB, 2)) GB |
          | 选项 | $($options -join '、') |
          | SHA256 | ``$($env:ISO_SHA256)`` |
          | 来源 | [UUP dump]($($env:UUP_URL)) |

          $unattendNotes

          ### 下载与合并

          1. 下载全部 ``.001`` / ``.002`` / ``.003`` 分卷到同一目录
          2. 用 7-Zip 打开 ``.001`` 解出 ISO：``7z x "$($env:ISO_NAME).zip.001"``（或 ``copy /b`` 拼接）
          3. 校验 SHA256 与上表一致
          "@

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag 已存在，覆盖上传分卷"
              gh release upload $tag @files --clobber
          } else {
              gh release create $tag @files --title $title --notes-file $notesPath
          }
          if ($LASTEXITCODE) { throw "发布 Release 失败，退出码 $LASTEXITCODE" }
          Write-Host "已发布: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"

          Add-Content $env:GITHUB_STEP_SUMMARY $notes
